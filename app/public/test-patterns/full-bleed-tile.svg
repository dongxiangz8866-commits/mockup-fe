<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <pattern id="checker" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="#0d1b2a"/>
      <circle cx="60" cy="60" r="38" fill="#e0fbfc"/>
      <circle cx="60" cy="60" r="20" fill="#ee6c4d"/>
      <rect x="0" y="0" width="60" height="60" fill="#3a86ff" fill-opacity="0.55"/>
      <rect x="60" y="60" width="60" height="60" fill="#ffbe0b" fill-opacity="0.55"/>
    </pattern>
    <pattern id="stripes" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="40" height="40" fill="none"/>
      <line x1="0" y1="20" x2="40" y2="20" stroke="#0a0a0a" stroke-width="4" stroke-opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="1200" height="1200" fill="url(#checker)"/>
  <rect width="1200" height="1200" fill="url(#stripes)"/>
  <rect width="1200" height="1200" fill="none" stroke="#0a0a0a" stroke-width="8"/>
</svg>
